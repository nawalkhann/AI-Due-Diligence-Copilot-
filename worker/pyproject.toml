[project]
name = "ddc-worker"
version = "0.1.0"
description = "Document ingestion worker for the Due Diligence Copilot"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ddc-worker = "ddc_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddc_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
